[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-shinkansen"
version = "0.2.0"
description = "Linux-first userspace USB driver and input bridge for the Taito TCPP-20011"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyusb>=1.3,<2",
  "libusb-package>=1.0.26,<2",
  "evdev>=1.7,<2; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9"]

[project.scripts]
open-shinkansen = "open_shinkansen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
